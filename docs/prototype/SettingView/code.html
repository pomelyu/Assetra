<body class="bg-slate-100 font-sans text-slate-900 antialiased flex justify-center items-center min-h-screen p-0 sm:p-4">

<rect height="11.5" rx="0.8" width="3" x="13.5" y="0.5"></rect>

</section>

<button class="w-full px-4 py-3.5 flex items-center justify-between text-left hover:bg-slate-50 active:bg-slate-100 transition duration-150">

</button>

<path d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>

</div>

<path d="M19 14l-7 7m0 0l-7-7m7 7V3" stroke-linecap="round" stroke-linejoin="round"></path>

<path d="M5 10l7-7m0 0l7 7m-7-7v18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<p class="text-[15px] font-semibold text-slate-800 leading-tight">匯出資料</p>
<p class="text-xs text-slate-400 mt-1 leading-none">匯出所有資料備份</p>

<svg class="w-4 h-4 text-slate-300 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>

</div>
</section>

<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"></path>

<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round"></path>

<div>

<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>

<path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>

<div>

<p class="text-xs text-slate-400 mt-1 leading-none">1.0.0</p>

</div>
<svg class="w-4 h-4 text-slate-300 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>

</div>

<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
